<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裁判書搜尋系統</title>
    <style>
        body { font-family: "微軟正黑體", Arial, sans-serif; max-width: 1000px; margin: 20px auto; line-height: 1.6; color: #333; }
        
        /* 搜尋條件區塊 */
        .search-box { background: #eef2eb; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d0dcae; }
        .search-box input, .search-box select { padding: 8px; margin: 5px; width: calc(25% - 15px); box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .search-box button { padding: 8px 20px; background: #4a7766; color: white; border: none; cursor: pointer; border-radius: 4px; margin-left: 5px; font-weight: bold; }
        .search-box button:hover { background: #365b4d; }

        /* 查詢結果表格 (仿司法院風格) */
        .result-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        .result-table th, .result-table td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; vertical-align: top; }
        .result-table th { background-color: #4a7766; color: white; font-weight: normal; } 
        
        /* 案號超連結與內文摘要 */
        .result-title-link { color: #0000cc; text-decoration: none; cursor: pointer; font-weight: bold; font-size: 1.05em; }
        .result-title-link:hover { text-decoration: underline; color: #cc0000; }
        .snippet { color: #555; font-size: 0.9em; margin-top: 8px; display: block; line-height: 1.5; }

        /* 彈出視窗 (Modal) 樣式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 30px; border: 1px solid #888; width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; margin-top: -10px; }
        .close-btn:hover { color: black; }
        .modal-header { border-bottom: 2px solid #4a7766; padding-bottom: 10px; margin-bottom: 20px; }
        .modal-header h3 { color: #0000cc; margin: 0 0 10px 0; }
        .modal-body { white-space: pre-wrap; font-size: 1.05em; line-height: 1.8; color: #222; }

        
    </style>
</head>
<body>

    <h2>⚖️ 裁判書搜尋系統</h2>

    <!-- 搜尋條件區 -->
    <div class="search-box">
        <select id="courtInput">
            <option value="">全部法院</option>
        </select>
        <input type="text" id="caseNoInput" placeholder="裁判案號 (如: 162)">
        <input type="text" id="titleInput" placeholder="案由 (如: 詐欺)">
        <input type="text" id="contentInput" placeholder="全文檢索 (如: 賠償)">
        <button onclick="searchJudgments()">搜尋</button>
    </div>

    <!-- 🤖 全局 AI 問答區塊 -->
    <div class="search-box" style="background: #e3f2fd; border: 1px solid #90caf9;">
        <h4 style="margin-top: 0; color: #1565c0;">🤖 針對目前列表上的案件提問</h4>
        <input type="text" id="globalAiQuestion" placeholder="例如：這些詐欺案的被告大多被判幾個月？" style="width: 75%;">
        <button onclick="askGlobalAI()" style="background: #1976d2; width: auto;">向 AI 發問</button>
        <div id="globalAiAnswer" style="background: #fff; padding: 15px; margin-top: 15px; border-radius: 5px; display: none; line-height: 1.8;"></div>
    </div>

    <!-- 結果顯示區 -->
    <div id="results">
        <p>資料載入中，請稍候...</p>
    </div>

    <!-- 全文顯示彈出視窗 (Modal) -->
    <div id="judgementModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h3 id="modalTitle">裁判字號</h3>
                <span id="modalMeta" style="color: #666; font-size: 0.9em;"></span>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script>
        let judgmentsData = [];
        let currentFilteredData = []; // 用來儲存目前畫面上顯示的案件陣列

        // 法院代碼與中文名稱對照表
        const courtMapping = {
            "TPD": "臺灣臺北地方法院", "SLD": "臺灣士林地方法院", "PCD": "臺灣新北地方法院",
            "TYD": "臺灣桃園地方法院", "SCD": "臺灣新竹地方法院", "MLD": "臺灣苗栗地方法院",
            "TCD": "臺灣臺中地方法院", "CHD": "臺灣彰化地方法院", "NTD": "臺灣南投地方法院",
            "YLD": "臺灣雲林地方法院", "CYD": "臺灣嘉義地方法院", "TND": "臺灣臺南地方法院",
            "KSD": "臺灣高雄地方法院", "PTD": "臺灣屏東地方法院", "TTD": "臺灣臺東地方法院",
            "HLD": "臺灣花蓮地方法院", "ILD": "臺灣宜蘭地方法院", "KLD": "臺灣基隆地方法院",
            "PHD": "臺灣澎湖地方法院", "KMD": "福建金門地方法院", "LCD": "福建連江地方法院",
            "KSY": "臺灣高雄少年及家事法院", "TNH": "臺灣高等法院臺南分院"
        };

        // 動態生成下拉選單
        const courtSelect = document.getElementById('courtInput');
        for (const [code, name] of Object.entries(courtMapping)) {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = name;
            courtSelect.appendChild(option);
        }

        // 取得完整法院名稱
        function getCourtName(id) {
            if (!id) return "未知法院";
            const code = id.split(',')[0]; 
            const prefix = code.substring(0, 3); 
            return courtMapping[prefix] || code;
        }

        // 將西元日期轉換為民國格式
        function formatROCDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr;
            const year = parseInt(dateStr.substring(0, 4)) - 1911;
            const month = dateStr.substring(4, 6);
            const day = dateStr.substring(6, 8);
            return `${year}.${month}.${day}`;
        }

        // 載入已經清洗好、包含 main_text 的 JSON 資料
        fetch('cleaned_judgments2.json')
            .then(response => response.json())
            .then(data => {
                judgmentsData = data;
                currentFilteredData = data; 
                displayResults(currentFilteredData);
            })
            .catch(error => {
                document.getElementById('results').innerHTML = `<p style="color:red;">❌ 無法讀取資料，請確認 cleaned_judgments2.json 是否存在。</p>`;
            });

        // 搜尋邏輯
        function searchJudgments() {
            const court = document.getElementById('courtInput').value;
            const caseNo = document.getElementById('caseNoInput').value.trim();
            const title = document.getElementById('titleInput').value.trim();
            const keyword = document.getElementById('contentInput').value.trim();

            currentFilteredData = judgmentsData.filter(item => {
                const matchCourt = court === "" || (item.id && item.id.includes(court));
                const matchCaseNo = caseNo === "" || (item.case_no && item.case_no.includes(caseNo));
                const matchTitle = title === "" || (item.title && item.title.includes(title));
                const matchKeyword = keyword === "" || (item.content && item.content.includes(keyword));
                return matchCourt && matchCaseNo && matchTitle && matchKeyword;
            });

            // 隱藏之前的 AI 回答
            document.getElementById('globalAiAnswer').style.display = "none";
            document.getElementById('globalAiQuestion').value = "";

            displayResults(currentFilteredData);
        }

        // 顯示結果列表
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (data.length === 0) {
                resultsDiv.innerHTML = `<p>找不到符合條件的裁判書。</p>`;
                return;
            }

            let html = `<p style="text-align: right; color: #555; font-size: 0.9em;">共 ${data.length} 筆</p>`;
            html += `<table class="result-table">
                        <thead>
                            <tr>
                                <th width="5%">序號</th>
                                <th width="60%">裁判字號 (內容摘要)</th>
                                <th width="15%">裁判日期</th>
                                <th width="20%">裁判案由</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            data.forEach((item, index) => {
                const courtName = getCourtName(item.id);
                const fullTitle = `${courtName} ${item.year} 年度 ${item.case_type} 字第 ${item.case_no} 號裁判`;
                const rocDate = formatROCDate(item.date);
                
                // 💡 修改重點：優先顯示「主文」，若無主文則降級顯示「摘要」
                let displaySnippet = "";
                if (item.main_text && item.main_text.trim() !== "") {
                    // 主文若太長一樣稍微截斷，保持畫面整潔
                    const truncatedMain = item.main_text.length > 120 ? item.main_text.substring(0, 120) + '...' : item.main_text;
                    // 使用紅色標籤強調這是判決結果
                    displaySnippet = `<strong style="color: #d9534f;">【主文】</strong> ${truncatedMain}`;
                } else {
                    const previewContent = item.content.length > 120 ? item.content.substring(0, 120) + '...' : item.content;
                    displaySnippet = `<strong>【摘要】</strong> ${previewContent}`;
                }

                html += `
                    <tr>
                        <td>${index + 1}.</td>
                        <td>
                            <a class="result-title-link" onclick="showFullContent('${item.id}')">${fullTitle}</a>
                            <span class="snippet">${displaySnippet}</span>
                        </td>
                        <td>${rocDate}</td>
                        <td>${item.title}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            resultsDiv.innerHTML = html;
        }

        // 顯示全文 Modal
        function showFullContent(id) {
            const item = judgmentsData.find(j => j.id === id);
            if (!item) return;

            const courtName = getCourtName(item.id);
            const fullTitle = `${courtName} ${item.year} 年度 ${item.case_type} 字第 ${item.case_no} 號裁判`;
            const rocDate = formatROCDate(item.date);

            document.getElementById('modalTitle').textContent = fullTitle;
            document.getElementById('modalMeta').innerHTML = `<strong>裁判日期：</strong>${rocDate} &nbsp;|&nbsp; <strong>案由：</strong>${item.title}`;
            document.getElementById('modalBody').textContent = item.content;

            document.getElementById('judgementModal').style.display = "block";
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('judgementModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('judgementModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // 🤖 向後端 API 傳送多筆判決書進行發問的函式
        function askGlobalAI() {
            const question = document.getElementById('globalAiQuestion').value.trim();
            const answerBox = document.getElementById('globalAiAnswer');
            
            if (!question) return;
            
            if (currentFilteredData.length === 0) {
                alert("目前畫面上沒有任何案件可以讓 AI 閱讀喔！請先調整搜尋條件。");
                return;
            }

            const maxCasesToAnalyze = 50;
            let analyzeCount = currentFilteredData.length;
            
            if (analyzeCount > maxCasesToAnalyze) {
                analyzeCount = maxCasesToAnalyze;
                answerBox.innerHTML = `<em>🤖 案件數量較多，避免系統超載，AI 將僅針對最前面的 <strong>${analyzeCount}</strong> 筆案件進行深度分析，請稍候...</em>`;
            } else {
                answerBox.innerHTML = `<em>🤖 AI 正在交叉比對這 <strong>${analyzeCount}</strong> 筆案件，請稍候...</em>`;
            }

            answerBox.style.display = "block";
            
            const contentsToSent = currentFilteredData.slice(0, maxCasesToAnalyze).map(item => {
                return `【${item.year}年度${item.case_type}字第${item.case_no}號】\n${item.content}`;
            });

            fetch('http://localhost:8000/api/ask_multiple', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    judgments_content: contentsToSent,
                    question: question
                })
            })
            .then(res => res.json())
            .then(data => {
                const formattedAnswer = data.answer.replace(/\n/g, '<br>');
                answerBox.innerHTML = `<strong style="color:#1565c0;">AI 分析結果：</strong><br><br>${formattedAnswer}`;
            })
            .catch(err => {
                console.error(err);
                answerBox.innerHTML = `<span style="color:red;">連線失敗，請確認 FastAPI 後端伺服器 (http://localhost:8000) 是否已啟動。</span>`;
            });
        }
    </script>
</body>
</html>
