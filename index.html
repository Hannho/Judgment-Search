<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裁判書搜尋系統</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; line-height: 1.6; }
        .search-box { background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        /* 💡 修改：將 select 也加入樣式設定，讓它跟 input 框一樣寬度對齊 */
        .search-box input, .search-box select { padding: 8px; margin: 5px; width: calc(50% - 25px); box-sizing: border-box; }
        .search-box button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 10px; }
        .search-box button:hover { background: #0056b3; }
        .result-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .result-title { color: #0056b3; margin-top: 0; }
        .result-content { color: #555; font-size: 0.9em; }
        .court-badge { display: inline-block; background: #e9ecef; padding: 3px 8px; border-radius: 12px; font-size: 0.85em; color: #333; margin-bottom: 8px; }
    </style>
</head>
<body>

    <h2>🏛️ 裁判書搜尋系統 (Prototype)</h2>

    <!-- 搜尋條件區 -->
    <div class="search-box">
        <!-- 💡 修改：將 input 改為 select 下拉選單，並預設一個「全部法院」的選項 -->
        <select id="courtInput">
            <option value="">全部法院</option>
        </select>
        <input type="text" id="caseNoInput" placeholder="裁判案號 (如: 162)">
        <input type="text" id="titleInput" placeholder="案由 (如: 詐欺)">
        <input type="text" id="contentInput" placeholder="內文關鍵字 (全文檢索)">
        <button onclick="searchJudgments()">搜尋</button>
    </div>

    <!-- 結果顯示區 -->
    <div id="results">
        <p>資料載入中，請稍候...</p>
    </div>

    <script>
        let judgmentsData = [];

        // 法院代碼與中文名稱的對照表
        const courtMapping = {
            "TPD": "臺灣臺北地方法院", "SLD": "臺灣士林地方法院", "PCD": "臺灣新北地方法院",
            "TYD": "臺灣桃園地方法院", "SCD": "臺灣新竹地方法院", "MLD": "臺灣苗栗地方法院",
            "TCD": "臺灣臺中地方法院", "CHD": "臺灣彰化地方法院", "NTD": "臺灣南投地方法院",
            "YLD": "臺灣雲林地方法院", "CYD": "臺灣嘉義地方法院", "TND": "臺灣臺南地方法院",
            "KSD": "臺灣高雄地方法院", "PTD": "臺灣屏東地方法院", "TTD": "臺灣臺東地方法院",
            "HLD": "臺灣花蓮地方法院", "ILD": "臺灣宜蘭地方法院", "KLD": "臺灣基隆地方法院",
            "PHD": "臺灣澎湖地方法院", "KMD": "福建金門地方法院", "LCD": "福建連江地方法院",
            "KSY": "臺灣高雄少年及家事法院", "TNH": "臺灣高等法院臺南分院"
        };

        // 💡 新增：網頁載入時，自動利用 courtMapping 動態生成下拉選單的選項
        const courtSelect = document.getElementById('courtInput');
        for (const [code, name] of Object.entries(courtMapping)) {
            const option = document.createElement('option');
            option.value = code; // 內部值存代碼，例如 "ILD"
            option.textContent = name; // 畫面上顯示中文，例如 "臺灣宜蘭地方法院"
            courtSelect.appendChild(option);
        }

        function getCourtName(id) {
            if (!id) return "未知法院";
            const code = id.split(',')[0]; 
            const prefix = code.substring(0, 3); 
            const typeLetter = code.substring(3, 4); 
            
            let courtName = courtMapping[prefix] || code;
            let typeName = "";
            
            if (typeLetter === "M") typeName = " (刑事)";
            else if (typeLetter === "V") typeName = " (民事)";
            
            return courtName + typeName;
        }

        // 網頁一載入，就去讀取同一層目錄的 JSON 檔
        fetch('cleaned_judgments.json')
            .then(response => response.json())
            .then(data => {
                judgmentsData = data;
                displayResults(judgmentsData);
            })
            .catch(error => {
                document.getElementById('results').innerHTML = `<p style="color:red;">❌ 無法讀取資料，請確認 cleaned_judgments.json 是否存在。</p>`;
            });

        function searchJudgments() {
            // 💡 這裡取得的 court 會是下拉選單的 value（也就是代碼，例如 "ILD" 或是空字串 ""）
            const court = document.getElementById('courtInput').value;
            const caseNo = document.getElementById('caseNoInput').value.trim();
            const title = document.getElementById('titleInput').value.trim();
            const keyword = document.getElementById('contentInput').value.trim();

            const filteredData = judgmentsData.filter(item => {
                // 💡 修改：因為下拉選單直接傳回代碼（如 ILD），我們只要比對 item.id 是否包含該代碼即可
                const matchCourt = court === "" || (item.id && item.id.includes(court));
                                 
                const matchCaseNo = caseNo === "" || (item.case_no && item.case_no.includes(caseNo));
                const matchTitle = title === "" || (item.title && item.title.includes(title));
                const matchKeyword = keyword === "" || (item.content && item.content.includes(keyword));

                return matchCourt && matchCaseNo && matchTitle && matchKeyword;
            });

            displayResults(filteredData);
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (data.length === 0) {
                resultsDiv.innerHTML = `<p>找不到符合條件的裁判書。</p>`;
                return;
            }

            resultsDiv.innerHTML = `<h3>目前顯示案件：共 ${data.length} 筆</h3>`;
            
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                const courtName = getCourtName(item.id);
                const previewContent = item.content.length > 150 ? item.content.substring(0, 150) + '...' : item.content;

                div.innerHTML = `
                    <span class="court-badge">${courtName}</span>
                    <h4 class="result-title">${item.year}年度 ${item.case_type}字 第${item.case_no}號 - ${item.title}</h4>
                    <p><strong>裁判日期：</strong> ${item.date}</p>
                    <p class="result-content">${previewContent}</p>
                    ${item.pdf_url ? `<a href="${item.pdf_url}" target="_blank">🔗 下載官方 PDF</a>` : ''}
                `;
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
