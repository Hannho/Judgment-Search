<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裁判書搜尋與歷審查詢系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>⚖️ 裁判書搜尋與歷審查詢系統</h2>

    <!-- 搜尋條件區塊 -->
    <div class="search-box">
        <div class="basic-search-row">
            <select id="courtInput" style="width: 280px;"><option value="">全部法院</option></select>
            <input type="text" id="quickKeywordInput" placeholder="全文或案號快速檢索 (多個關鍵字以空格分開)..." style="flex: 1; min-width: 220px;">
            <button class="btn-primary" onclick="searchJudgments()">🔍 開始搜尋</button>
            <button class="btn-toggle" type="button" onclick="toggleAdvancedSearch()">⚙️ <span id="toggleText">展開進階搜尋</span></button>
            <button class="btn-reset" type="button" onclick="resetSearch()">重設</button>
        </div>

        <!-- 錯誤提示條 -->
        <div id="searchErrorMessage" class="alert-error"></div>

        <!-- 司法院風格進階搜尋面板 -->
        <div id="advancedPanel" class="advanced-panel" style="display: none;">
            <table class="adv-table">
                <tr>
                    <td class="adv-label">案件類別</td>
                    <td>
                        <label><input type="checkbox" name="caseCategory" value="憲法"> 憲法</label>&nbsp;&nbsp;
                        <label><input type="checkbox" name="caseCategory" value="民事"> 民事</label>&nbsp;&nbsp;
                        <label><input type="checkbox" name="caseCategory" value="刑事"> 刑事</label>&nbsp;&nbsp;
                        <label><input type="checkbox" name="caseCategory" value="行政"> 行政</label>&nbsp;&nbsp;
                        <label><input type="checkbox" name="caseCategory" value="懲戒"> 懲戒</label>
                        <span class="hint-text">(未勾選預設為全選)</span>
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判書類別</td>
                    <td>
                        <label><input type="radio" name="docType" value="" checked> 全部</label>&nbsp;&nbsp;
                        <label><input type="radio" name="docType" value="判決"> 判決</label>&nbsp;&nbsp;
                        <label><input type="radio" name="docType" value="裁定"> 裁定</label>
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判字號</td>
                    <td>
                        <input type="text" id="advYear" class="input-mini" placeholder="115"> 年度&nbsp;
                        <input type="text" id="advCaseType" class="input-short" placeholder="簡/訴/交易"> 字第&nbsp;
                        <input type="text" id="advNoStart" class="input-mini" placeholder="號數起"> 號
                        至 <input type="text" id="advNoEnd" class="input-mini" placeholder="號數迄"> 號
                        <span style="color: #666; font-size: 0.85em; margin-left: 8px;">(單一號數填左側即可)</span>
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判期間</td>
                    <td>
                        民國 
                        <input type="number" id="startYear" class="input-mini" placeholder="114"> 年
                        <input type="number" id="startMonth" class="input-mini" min="1" max="12" placeholder="1"> 月
                        <input type="number" id="startDay" class="input-mini" min="1" max="31" placeholder="1"> 日
                        至
                        <input type="number" id="endYear" class="input-mini" placeholder="115"> 年
                        <input type="number" id="endMonth" class="input-mini" min="1" max="12" placeholder="12"> 月
                        <input type="number" id="endDay" class="input-mini" min="1" max="31" placeholder="31"> 日
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判案由</td>
                    <td>
                        <input type="text" id="advTitle" class="input-medium" placeholder="多關鍵字以空格分開，如：過失 傷害">
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判主文</td>
                    <td>
                        <input type="text" id="advMainText" class="input-wide" placeholder="多關鍵字以空格分開，如：有期徒刑 易科罰金 緩刑">
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">全文內容</td>
                    <td>
                        <input type="text" id="advContent" class="input-wide" placeholder="多關鍵字以空格分開，如：洗錢 帳戶 自白">
                    </td>
                </tr>
                <tr>
                    <td class="adv-label">裁判大小</td>
                    <td>
                        <input type="number" id="advSizeMin" class="input-mini" placeholder="0"> KB ～ 
                        <input type="number" id="advSizeMax" class="input-mini" placeholder="500"> KB
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 🤖 裁判書 AI 智慧分析對話助手 -->
    <div class="chat-card">
        <div class="chat-header">
            <h4>🤖 裁判書 AI 智慧分析助理</h4>
            <button class="chat-clear-btn" type="button" onclick="clearChatMessages()">清空對話</button>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="chat-bubble-row bot">
                <div class="chat-avatar bot-avatar">AI</div>
                <div class="chat-bubble bot-bubble">
                    你好！我是裁判書分析助理。你可以針對目前搜尋列表中的案件提出任何法律或統計問題（例如：「這些詐欺案件的被告大多判刑多久？」或「請幫我整理這些交通事故的主文責任比例」）。
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="請輸入對當前搜尋案件的提問...">            <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()">
                發送
            </button>
        </div>
    </div>

    <!-- 左右分欄內容區 -->
    <div class="main-container">
        <!-- 左側：搜尋結果列表 -->
        <div id="results" class="list-panel">
            <p>資料載入中，請稍候...</p>
        </div>

        <!-- 右側：判決書詳情與歷審紀錄 -->
        <div id="sidePanel" class="detail-panel">
            <h3 id="sideTitle" style="color: #0000cc; margin-top: 0;"></h3>
            <div id="sideMeta" style="color: #666; font-size: 0.9em; border-bottom: 1px solid #eee; padding-bottom: 10px;"></div>
            
            <div id="historyLoading" class="history-loading">
                ⏳ 正在啟動背景爬蟲，即時抓取歷審紀錄，請稍候約 5-10 秒...
            </div>
            <div id="sideHistory" class="history-box" style="display: none;"></div>

            <div id="sideBody" style="white-space: pre-wrap; font-size: 1.05em; line-height: 1.8; color: #222; margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        let judgmentsData = [];
        let currentFilteredData = [];
        let currentSearchKeywords = [];

        // 全台法院、高分院、高等行政法院、簡易庭完整中文對照表
        const courtMapping = {
            "TPS": "最高法院", "TPA": "最高行政法院", "TPC": "懲戒法院", "CPC": "司法院憲法法庭",
            "TPH": "臺灣高等法院", "TCH": "臺灣高等法院臺中分院", "TNH": "臺灣高等法院臺南分院",
            "KSH": "臺灣高等法院高雄分院", "HLH": "臺灣高等法院花蓮分院", "KMH": "福建高等法院金門分院",
            "TPB": "臺北高等行政法院", "TCB": "臺中高等行政法院", "KSB": "高雄高等行政法院",
            "TPD": "臺灣臺北地方法院", "SLD": "臺灣士林地方法院", "PCD": "臺灣新北地方法院",
            "TYD": "臺灣桃園地方法院", "SCD": "臺灣新竹地方法院", "MLD": "臺灣苗栗地方法院",
            "TCD": "臺灣臺中地方法院", "CHD": "臺灣彰化地方法院", "NTD": "臺灣南投地方法院",
            "YLD": "臺灣雲林地方法院", "CYD": "臺灣嘉義地方法院", "TND": "臺灣臺南地方法院",
            "KSD": "臺灣高雄地方法院", "PTD": "臺灣屏東地方法院", "TTD": "臺灣臺東地方法院",
            "HLD": "臺灣花蓮地方法院", "ILD": "臺灣宜蘭地方法院", "KLD": "臺灣基隆地方法院",
            "PHD": "臺灣澎湖地方法院", "KMD": "福建金門地方法院", "LCD": "福建連江地方法院",
            "CLE": "臺灣桃園地方法院中壢簡易庭", "TYE": "臺灣桃園地方法院桃園簡易庭",
            "PCE": "臺灣新北地方法院板橋簡易庭", "STE": "臺灣新北地方法院三重簡易庭",
            "TPE": "臺灣臺北地方法院臺北簡易庭", "SLE": "臺灣士林地方法院士林簡易庭",
            "NIE": "臺灣士林地方法院內湖簡易庭", "ILE": "臺灣宜蘭地方法院宜蘭簡易庭",
            "LTE": "臺灣宜蘭地方法院羅東簡易庭", "KSE": "臺灣高雄地方法院高雄簡易庭",
            "FSE": "臺灣高雄地方法院鳳山簡易庭", "KSY": "臺灣高雄少年及家事法院", 
            "IPC": "智慧財產及商業法院"
        };

        const courtSelect = document.getElementById('courtInput');
        for (const [code, name] of Object.entries(courtMapping)) {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = name;
            courtSelect.appendChild(option);
        }

        function getCourtName(item) {
            if (!item) return "未知法院";

            const content = item.content || "";
            const firstLine = content.split('\n')[0] || "";
            const matchCourt = firstLine.match(/([^\s]+(?:法院|法庭))/);
            if (matchCourt && matchCourt[1]) {
                return matchCourt[1].trim();
            }

            const id = item.id || "";
            const firstSegment = id.split(',')[0] || "";
            const prefix3 = firstSegment.substring(0, 3);
            
            if (courtMapping[prefix3]) return courtMapping[prefix3];
            if (courtMapping[firstSegment]) return courtMapping[firstSegment];

            return prefix3 || "未知法院";
        }

        function getDocumentKind(item) {
            const content = item.content || "";
            const firstLine = content.split('\n')[0] || "";
            
            if (firstLine.includes("裁定") || content.includes("裁定如下") || firstLine.includes("支付命令")) {
                return "裁定";
            }
            if (firstLine.includes("判決") || content.includes("判決如下")) {
                return "判決";
            }
            return "裁判";
        }

        function formatROCDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr;
            const year = parseInt(dateStr.substring(0, 4)) - 1911;
            return `${year}.${dateStr.substring(4, 6)}.${dateStr.substring(6, 8)}`;
        }

        function showSearchError(msg) {
            const errBox = document.getElementById('searchErrorMessage');
            errBox.textContent = `⚠️ ${msg}`;
            errBox.style.display = 'block';
        }

        function clearSearchError() {
            const errBox = document.getElementById('searchErrorMessage');
            errBox.textContent = '';
            errBox.style.display = 'none';
        }

        function toggleAdvancedSearch() {
            const panel = document.getElementById('advancedPanel');
            const toggleText = document.getElementById('toggleText');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                toggleText.textContent = '收起進階搜尋';
            } else {
                panel.style.display = 'none';
                toggleText.textContent = '展開進階搜尋';
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function parseKeywords(inputStr) {
            if (!inputStr) return [];
            return inputStr.trim().split(/[\s ]+/).filter(k => k.length > 0);
        }

        function generateHighlightedSnippet(text, keywords, maxLength = 110) {
            if (!text || text.trim() === "") return "";
            
            let firstMatchIndex = -1;
            for (const kw of keywords) {
                if (!kw) continue;
                const idx = text.indexOf(kw);
                if (idx !== -1 && (firstMatchIndex === -1 || idx < firstMatchIndex)) {
                    firstMatchIndex = idx;
                }
            }

            let snippet = "";
            if (firstMatchIndex !== -1) {
                const start = Math.max(0, firstMatchIndex - 25);
                const end = Math.min(text.length, start + maxLength);
                snippet = text.substring(start, end);
                if (start > 0) snippet = "..." + snippet;
                if (end < text.length) snippet = snippet + "...";
            } else {
                snippet = text.length > maxLength ? text.substring(0, maxLength) + "..." : text;
            }

            for (const kw of keywords) {
                if (!kw) continue;
                const safeKw = escapeRegExp(kw);
                const regex = new RegExp(`(${safeKw})`, 'gi');
                snippet = snippet.replace(regex, `<span class="highlight-kw">$1</span>`);
            }

            return snippet;
        }

        function applySorting(data, sortType) {
            const sorted = [...data];
            sorted.sort((a, b) => {
                const dateA = parseInt(a.date, 10) || 0;
                const dateB = parseInt(b.date, 10) || 0;

                const idPartsA = a.id ? a.id.split(',') : [];
                const idPartsB = b.id ? b.id.split(',') : [];
                const noA = parseInt((a.case_no && a.case_no.trim()) || idPartsA[3] || 0, 10);
                const noB = parseInt((b.case_no && b.case_no.trim()) || idPartsB[3] || 0, 10);

                const sizeA = (a.content || "").length;
                const sizeB = (b.content || "").length;

                switch (sortType) {
                    case "date_asc":
                        return dateA - dateB;
                    case "no_desc":
                        return noB - noA;
                    case "no_asc":
                        return noA - noB;
                    case "size_desc":
                        return sizeB - sizeA;
                    case "size_asc":
                        return sizeA - sizeB;
                    case "date_desc":
                    default:
                        return dateB - dateA;
                }
            });
            return sorted;
        }

        function handleSortChange(sortType) {
            currentFilteredData = applySorting(currentFilteredData, sortType);
            renderTableBody(currentFilteredData);
        }

        function resetSearch() {
            clearSearchError();
            currentSearchKeywords = [];

            document.getElementById('courtInput').value = "";
            document.getElementById('quickKeywordInput').value = "";
            document.querySelectorAll('input[name="caseCategory"]').forEach(cb => cb.checked = false);
            document.querySelector('input[name="docType"][value=""]').checked = true;
            
            document.getElementById('advYear').value = "";
            document.getElementById('advCaseType').value = "";
            document.getElementById('advNoStart').value = "";
            document.getElementById('advNoEnd').value = "";
            
            document.getElementById('startYear').value = "";
            document.getElementById('startMonth').value = "";
            document.getElementById('startDay').value = "";
            document.getElementById('endYear').value = "";
            document.getElementById('endMonth').value = "";
            document.getElementById('endDay').value = "";

            document.getElementById('advTitle').value = "";
            document.getElementById('advMainText').value = "";
            document.getElementById('advContent').value = "";
            document.getElementById('advSizeMin').value = "";
            document.getElementById('advSizeMax').value = "";

            const sortSelect = document.getElementById('tableSortSelect');
            const sortType = sortSelect ? sortSelect.value : "date_desc";
            currentFilteredData = applySorting(judgmentsData, sortType);
            displayResults(currentFilteredData);
            document.getElementById('sidePanel').style.display = "none";
        }

        function parseRocToDateInt(y, m, d, isEndDate = false) {
            if (!y) return null;
            const rocY = parseInt(y, 10);
            if (isNaN(rocY) || rocY < 1 || rocY > 200) {
                throw new Error("民國年份格式不正確（例如請填寫 114 或 115）");
            }
            
            let month = m ? parseInt(m, 10) : (isEndDate ? 12 : 1);
            let day = d ? parseInt(d, 10) : (isEndDate ? 31 : 1);

            if (isNaN(month) || month < 1 || month > 12) {
                throw new Error("月份格式錯誤，請填寫 1 至 12 之間的數值");
            }
            if (isNaN(day) || day < 1 || day > 31) {
                throw new Error("日期格式錯誤，請填寫 1 至 31 之間的數值");
            }

            const fullYear = rocY + 1911;
            const fullMonth = String(month).padStart(2, '0');
            const fullDay = String(day).padStart(2, '0');
            return parseInt(`${fullYear}${fullMonth}${fullDay}`, 10);
        }

        fetch('cleaned_judgments2.json')
            .then(response => response.json())
            .then(data => {
                const validData = data.filter(item => item && item.id && item.id.trim() !== "");
                judgmentsData = validData;
                currentFilteredData = applySorting(validData, "date_desc");
                displayResults(currentFilteredData);
            })
            .catch(error => {
                document.getElementById('results').innerHTML = `<p style="color:red;">❌ 無法讀取 cleaned_judgments2.json 資料，請確認檔案路徑。</p>`;
            });

        function searchJudgments() {
            clearSearchError();

            if (!judgmentsData || judgmentsData.length === 0) {
                showSearchError("目前尚未載入任何裁判書資料，無法進行比對。");
                return;
            }

            const court = document.getElementById('courtInput').value;
            const checkedCategories = Array.from(document.querySelectorAll('input[name="caseCategory"]:checked')).map(cb => cb.value);
            const selectedDocType = document.querySelector('input[name="docType"]:checked')?.value || "";

            const advYear = document.getElementById('advYear').value.trim();
            const advCaseType = document.getElementById('advCaseType').value.trim();
            const advNoStart = document.getElementById('advNoStart').value.trim();
            const advNoEnd = document.getElementById('advNoEnd').value.trim();

            const quickKeywords = parseKeywords(document.getElementById('quickKeywordInput').value);
            const titleKeywords = parseKeywords(document.getElementById('advTitle').value);
            const mainTextKeywords = parseKeywords(document.getElementById('advMainText').value);
            const contentKeywords = parseKeywords(document.getElementById('advContent').value);

            currentSearchKeywords = [];
            [...quickKeywords, ...titleKeywords, ...mainTextKeywords, ...contentKeywords].forEach(kw => {
                if (kw && !currentSearchKeywords.includes(kw)) {
                    currentSearchKeywords.push(kw);
                }
            });

            let noStart = null;
            let noEnd = null;
            if (advNoStart !== "") {
                noStart = parseInt(advNoStart, 10);
                if (isNaN(noStart)) {
                    showSearchError("裁判號數【起】請填寫純數字");
                    return;
                }
            }
            if (advNoEnd !== "") {
                noEnd = parseInt(advNoEnd, 10);
                if (isNaN(noEnd)) {
                    showSearchError("裁判號數【迄】請填寫純數字");
                    return;
                }
            }
            if (noStart !== null && noEnd !== null && noStart > noEnd) {
                showSearchError("裁判號數範圍無效：起始號數不能大於結束號數。");
                return;
            }

            let startDateInt = null;
            let endDateInt = null;
            try {
                const sY = document.getElementById('startYear').value.trim();
                const sM = document.getElementById('startMonth').value.trim();
                const sD = document.getElementById('startDay').value.trim();
                const eY = document.getElementById('endYear').value.trim();
                const eM = document.getElementById('endMonth').value.trim();
                const eD = document.getElementById('endDay').value.trim();

                if (sY || sM || sD) startDateInt = parseRocToDateInt(sY, sM, sD, false);
                if (eY || eM || eD) endDateInt = parseRocToDateInt(eY, eM, eD, true);

                if (startDateInt && endDateInt && startDateInt > endDateInt) {
                    showSearchError("裁判期間錯誤：起始日期不得晚於結束日期。");
                    return;
                }
            } catch (err) {
                showSearchError(err.message);
                return;
            }

            const sizeMinVal = document.getElementById('advSizeMin').value.trim();
            const sizeMaxVal = document.getElementById('advSizeMax').value.trim();
            const sizeMin = sizeMinVal !== "" ? parseFloat(sizeMinVal) : NaN;
            const sizeMax = sizeMaxVal !== "" ? parseFloat(sizeMaxVal) : NaN;

            if (!isNaN(sizeMin) && !isNaN(sizeMax) && sizeMin > sizeMax) {
                showSearchError("裁判大小範圍錯誤：最小容量 (KB) 不能大於最大容量 (KB)。");
                return;
            }

            let filtered = judgmentsData.filter(item => {
                const idParts = item.id ? item.id.split(',') : [];
                const itemCourtCode = idParts[0] || ""; 
                const itemYear = (item.year && item.year.trim()) || idParts[1] || "";
                const itemCaseType = (item.case_type && item.case_type.trim()) || idParts[2] || "";
                const itemCaseNo = (item.case_no && item.case_no.trim()) || idParts[3] || "";
                const itemContent = item.content || "";
                const itemMainText = item.main_text || "";
                const itemTitle = item.title || "";
                const itemDateInt = item.date ? parseInt(item.date, 10) : null;

                if (court !== "" && !(item.id && item.id.includes(court))) return false;

                if (selectedDocType !== "") {
                    const kind = getDocumentKind(item);
                    if (kind !== selectedDocType) return false;
                }

                if (quickKeywords.length > 0) {
                    const passQuick = quickKeywords.every(kw => {
                        return (item.id && item.id.includes(kw)) ||
                               itemCaseNo.includes(kw) ||
                               itemTitle.includes(kw) ||
                               itemContent.includes(kw) ||
                               itemMainText.includes(kw);
                    });
                    if (!passQuick) return false;
                }

                if (checkedCategories.length > 0) {
                    const courtTypeChar = itemCourtCode.length >= 4 ? itemCourtCode.charAt(3) : "";
                    const firstLine = itemContent.split('\n')[0] || "";

                    const isMatchedCategory = checkedCategories.some(cat => {
                        if (cat === "刑事") {
                            return courtTypeChar === "M" || 
                                   firstLine.includes("刑事") || 
                                   ["訴", "簡", "易", "金重訴", "交易", "交簡"].includes(itemCaseType);
                        }
                        if (cat === "民事") {
                            return courtTypeChar === "V" || 
                                   courtTypeChar === "E" || 
                                   firstLine.includes("民事") || 
                                   firstLine.includes("支付命令") ||
                                   ["司促", "司拍", "執事聲", "宜訴", "羅簡", "苗小", "苗簡", "壢小", "壢保險簡", "壢司他"].includes(itemCaseType);
                        }
                        if (cat === "行政") {
                            return courtTypeChar === "A" || firstLine.includes("行政");
                        }
                        if (cat === "憲法") {
                            return firstLine.includes("憲法");
                        }
                        if (cat === "懲戒") {
                            return firstLine.includes("懲戒");
                        }
                        return false;
                    });

                    if (!isMatchedCategory) return false;
                }

                if (advYear !== "" && itemYear !== advYear) return false;
                if (advCaseType !== "" && !itemCaseType.includes(advCaseType)) return false;

                if (noStart !== null) {
                    const currentNo = parseInt(itemCaseNo, 10);
                    if (isNaN(currentNo)) {
                        if (!itemCaseNo.includes(String(noStart))) return false;
                    } else {
                        if (noEnd !== null) {
                            if (currentNo < noStart || currentNo > noEnd) return false;
                        } else {
                            if (currentNo !== noStart) return false;
                        }
                    }
                }

                if (itemDateInt) {
                    if (startDateInt && itemDateInt < startDateInt) return false;
                    if (endDateInt && itemDateInt > endDateInt) return false;
                }

                if (titleKeywords.length > 0) {
                    const passTitle = titleKeywords.every(kw => itemTitle.includes(kw));
                    if (!passTitle) return false;
                }

                if (mainTextKeywords.length > 0) {
                    const passMain = mainTextKeywords.every(kw => {
                        return (itemMainText && itemMainText.includes(kw)) || itemContent.includes(kw);
                    });
                    if (!passMain) return false;
                }

                if (contentKeywords.length > 0) {
                    const passContent = contentKeywords.every(kw => itemContent.includes(kw));
                    if (!passContent) return false;
                }

                if (!isNaN(sizeMin) || !isNaN(sizeMax)) {
                    const sizeKB = (itemContent.length * 2) / 1024;
                    if (!isNaN(sizeMin) && sizeKB < sizeMin) return false;
                    if (!isNaN(sizeMax) && sizeKB > sizeMax) return false;
                }

                return true;
            });

            const sortSelect = document.getElementById('tableSortSelect');
            const sortType = sortSelect ? sortSelect.value : "date_desc";
            currentFilteredData = applySorting(filtered, sortType);

            displayResults(currentFilteredData);
            document.getElementById('sidePanel').style.display = "none"; 
        }

        function renderTableBody(data) {
            const tbody = document.getElementById('resultTableBody');
            if (!tbody) return;

            let bodyHtml = "";
            data.forEach((item, index) => {
                const idParts = item.id ? item.id.split(',') : [];
                const displayYear = (item.year && item.year.trim() !== "") ? item.year : (idParts[1] || "");
                const displayType = (item.case_type && item.case_type.trim() !== "") ? item.case_type : (idParts[2] || "");
                const displayNo = (item.case_no && item.case_no.trim() !== "") ? item.case_no : (idParts[3] || "");

                const courtName = getCourtName(item);
                const docKind = getDocumentKind(item);
                const fullTitle = `${courtName} ${displayYear} 年度 ${displayType} 字第 ${displayNo} 號${docKind}`;
                
                const contentText = item.content || "";
                const sizeKB = ((contentText.length * 2) / 1024).toFixed(1);
                const titleWithSize = `${fullTitle} <span style="color: #777; font-size: 0.85em; font-weight: normal;">(${sizeKB} KB)</span>`;

                const rocDate = formatROCDate(item.date);
                
                let displaySnippet = "";
                if (item.main_text && item.main_text.trim() !== "") {
                    const highlightedMain = generateHighlightedSnippet(item.main_text, currentSearchKeywords, 110);
                    displaySnippet = `<span class="main-text-tag">【主文】</span> ${highlightedMain}`; 
                } else if (item.content && item.content.trim() !== "") {
                    const highlightedContent = generateHighlightedSnippet(item.content, currentSearchKeywords, 110);
                    displaySnippet = `<span class="summary-tag">【摘要】</span> ${highlightedContent}`;
                } else {
                    displaySnippet = "<span style='color: #999;'>(此案件無內容)</span>";
                }

                bodyHtml += `
                    <tr>
                        <td>${index + 1}.</td>
                        <td>
                            <a class="result-title-link" onclick="showFullContent('${item.id}')">${titleWithSize}</a>
                            <span class="snippet">${displaySnippet}</span>
                        </td>
                        <td>${rocDate}</td>
                        <td>${item.title || "無案由"}</td>
                    </tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (data.length === 0) {
                resultsDiv.innerHTML = `
                    <div style="background: #fff3e0; border: 1px solid #ffe0b2; padding: 25px; border-radius: 6px; text-align: center; margin-top: 10px;">
                        <h4 style="color: #e65100; margin-top: 0;">🔍 查無符合條件的裁判書</h4>
                        <p style="color: #6d4c41; margin-bottom: 8px;">可能原因如下：</p>
                        <ul style="display: inline-block; text-align: left; color: #5d4037; font-size: 0.92em; line-height: 1.8;">
                            <li>輸入的多個關鍵字無法在同一筆案件中同時滿足 (AND 關係)</li>
                            <li>指定的書類別 (判決/裁定) 與勾選的案件類別衝突</li>
                            <li>指定的法院或年度查無此字號或號數</li>
                            <li>可點擊上方「<strong>重設</strong>」按鈕清空條件重新搜尋</li>
                        </ul>
                    </div>`;
                return;
            }

            const currentSortVal = document.getElementById('tableSortSelect')?.value || "date_desc";

            let html = `
                <div class="table-toolbar">
                    <span>共 <strong>${data.length}</strong> 筆符合條件</span>
                    <div>
                        <label for="tableSortSelect">排序方式：</label>
                        <select id="tableSortSelect" class="sort-select" onchange="handleSortChange(this.value)">
                            <option value="date_desc" ${currentSortVal === 'date_desc' ? 'selected' : ''}>裁判日期 (新到舊)</option>
                            <option value="date_asc" ${currentSortVal === 'date_asc' ? 'selected' : ''}>裁判日期 (舊到新)</option>
                            <option value="no_desc" ${currentSortVal === 'no_desc' ? 'selected' : ''}>裁判案號 (大到小)</option>
                            <option value="no_asc" ${currentSortVal === 'no_asc' ? 'selected' : ''}>裁判案號 (小到大)</option>
                            <option value="size_desc" ${currentSortVal === 'size_desc' ? 'selected' : ''}>全文大小 (大到小)</option>
                            <option value="size_asc" ${currentSortVal === 'size_asc' ? 'selected' : ''}>全文大小 (小到大)</option>
                        </select>
                    </div>
                </div>`;

            html += `<table class="result-table">
                        <thead>
                            <tr>
                                <th width="5%">序號</th>
                                <th width="65%">裁判字號 (主文摘要)</th>
                                <th width="15%">日期</th>
                                <th width="15%">案由</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody"></tbody>
                     </table>`;
            
            resultsDiv.innerHTML = html;
            renderTableBody(data);
        }

        function showFullContent(id) {
            const item = judgmentsData.find(j => j.id === id);
            if (!item) return;

            const idParts = item.id ? item.id.split(',') : [];
            const displayYear = (item.year && item.year.trim() !== "") ? item.year : (idParts[1] || "");
            const displayType = (item.case_type && item.case_type.trim() !== "") ? item.case_type : (idParts[2] || "");
            const displayNo = (item.case_no && item.case_no.trim() !== "") ? item.case_no : (idParts[3] || "");
            const courtName = getCourtName(item);
            const docKind = getDocumentKind(item);
            const fullTitle = `${courtName} ${displayYear} 年度 ${displayType} 字第 ${displayNo} 號${docKind}`;

            const contentText = item.content || "";
            const sizeKB = ((contentText.length * 2) / 1024).toFixed(1);

            document.getElementById('sideTitle').innerHTML = `${fullTitle} <span style="color: #777; font-size: 0.75em; font-weight: normal;">(${sizeKB} KB)</span>`;
            document.getElementById('sideMeta').innerHTML = `<strong>日期：</strong>${formatROCDate(item.date)} &nbsp;|&nbsp; <strong>案由：</strong>${item.title || "無"} &nbsp;|&nbsp; <strong>大小：</strong>${sizeKB} KB`;
            document.getElementById('sideBody').textContent = item.content;
            document.getElementById('sidePanel').style.display = "block";

            const historyBox = document.getElementById('sideHistory');
            const loadingBox = document.getElementById('historyLoading');
            historyBox.style.display = "none";
            loadingBox.style.display = "block";

            fetch('/api/get_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            })
            .then(res => res.json())
            .then(data => {
                loadingBox.style.display = "none";
                if (data.history && data.history.length > 0) {
                    let hHtml = "<strong>🔗 相關歷審裁判紀錄：</strong><ul>";
                    data.history.forEach(h => {
                        hHtml += `<li><a href="${h.url}" target="_blank">${h.title}</a></li>`;
                    });
                    historyBox.innerHTML = hHtml + "</ul>";
                } else {
                    historyBox.innerHTML = "此案件查無其他歷審紀錄。";
                }
                historyBox.style.display = "block";
            })
            .catch(err => {
                loadingBox.style.display = "none";
                historyBox.innerHTML = "<span style='color:red;'>連線至爬蟲伺服器失敗，請確認後端已啟動。</span>";
                historyBox.style.display = "block";
            });
        }

        // 🤖 聊天機器人相關功能函式
        function handleChatKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendChatMessage();
            }
        }

        function clearChatMessages() {
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('chatSendBtn');

            // 1. 還原預設歡迎訊息
            chatMessages.innerHTML = `
                <div class="chat-bubble-row bot">
                    <div class="chat-avatar bot-avatar">AI</div>
                    <div class="chat-bubble bot-bubble">
                        對話記錄已清空。您可以繼續針對目前列表上的案件進行提問。
                    </div>
                </div>`;

            // 2. 💡 強制解除禁用狀態並恢復輸入框功能
            if (chatInput) {
                chatInput.disabled = false;
                chatInput.value = '';
                chatInput.focus();
            }
            if (sendBtn) {
                sendBtn.disabled = false;
            }
        }

        function appendChatMessage(sender, contentHtml) {
            const chatMessages = document.getElementById('chatMessages');
            const row = document.createElement('div');
            row.className = `chat-bubble-row ${sender}`;

            if (sender === 'user') {
                row.innerHTML = `
                    <div class="chat-bubble user-bubble">${contentHtml}</div>
                    <div class="chat-avatar user-avatar">我</div>`;
            } else {
                row.innerHTML = `
                    <div class="chat-avatar bot-avatar">AI</div>
                    <div class="chat-bubble bot-bubble">${contentHtml}</div>`;
            }

            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return row;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            const sendBtn = document.getElementById('chatSendBtn');

            if (!question) return;

            if (!currentFilteredData || currentFilteredData.length === 0) {
                alert("目前畫面上沒有任何案件可以讓 AI 閱讀喔！請先確認搜尋條件。");
                return;
            }

            // 1. 在聊天室中加入使用者的提問泡泡
            appendChatMessage('user', escapeHtml(question));
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;

            // 2. 加入帶有打字動畫的暫時回覆泡泡
            const loadingRow = appendChatMessage('bot', `
                <div class="chat-typing">
                    <span></span><span></span><span></span>
                </div>
                <span style="color:#64748b; font-size:0.88em; margin-left:4px;">AI 正在研讀搜尋結果並統整分析中...</span>
            `);

            // 3. 限制傳送上限為 50 筆
            const maxCasesToAnalyze = 50;
            const contentsToSent = currentFilteredData.slice(0, maxCasesToAnalyze).map(item => {
                const idParts = item.id ? item.id.split(',') : [];
                const displayYear = (item.year && item.year.trim() !== "") ? item.year : (idParts[1] || "");
                const displayType = (item.case_type && item.case_type.trim() !== "") ? item.case_type : (idParts[2] || "");
                const displayNo = (item.case_no && item.case_no.trim() !== "") ? item.case_no : (idParts[3] || "");
                return `【${displayYear}年度${displayType}字第${displayNo}號】\n${item.content}`;
            });

            // 4. 發送請求至後端
            fetch('/api/ask_multiple', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    judgments_content: contentsToSent,
                    question: question
                })
            })
            .then(res => res.json())
            .then(data => {
                const botBubble = loadingRow.querySelector('.chat-bubble');
                
                let rawAnswer = "";
                if (Array.isArray(data.answer)) {
                    // 如果後端回傳的是陣列，把裡面每個物件的 text 撈出來組合
                    rawAnswer = data.answer.map(item => item.text || "").join("\n");
                } else if (typeof data.answer === 'string') {
                    rawAnswer = data.answer;
                } else {
                    rawAnswer = JSON.stringify(data.answer);
                }

                const formattedAnswer = rawAnswer.replace(/\n/g, '<br>');
                botBubble.innerHTML = formattedAnswer;
            })
            .catch(err => {
                console.error(err);
                const botBubble = loadingRow.querySelector('.chat-bubble');
                botBubble.innerHTML = `<span style="color:#d32f2f;">連線失敗：請確認 FastAPI 後端伺服器 (http://localhost:8000) 是否已正常啟動。</span>`;
            })
                .finally(() => {
                const input = document.getElementById('chatInput');
                const sendBtn = document.getElementById('chatSendBtn');
                if (input) {
                    input.disabled = false;
                    input.focus();
                }
                if (sendBtn) {
                    sendBtn.disabled = false;
                }
                const chatMessages = document.getElementById('chatMessages');
                if (chatMessages) {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
